name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt zsh
          npm install --global markdownlint-cli2@0.23.3 prettier@3.6.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        env:
          GOPATH: ${{ runner.temp }}/go
          GOBIN: ${{ runner.temp }}/go/bin

      - name: Add Go tools to PATH
        run: echo "${{ runner.temp }}/go/bin" >> "$GITHUB_PATH"

      - name: Run repository checks
        run: ./bin/dotfiles-lint
